version: "3.9"

services:

  backend:
    build: ./backend
    container_name: django-backend
    volumes:
      - ./backend:/backend
    expose:
      - 8000
    depends_on:
      - db
      - tonservice
    environment:
      - TON_SERVICE_URL=http://tonservice:3001
      


  frontend:
    build: ./frontend
    container_name: react-frontend
    restart: always
    # هیچ volumes و هیچ command نذار
    # Dockerfile خودش خروجی را می‌سازد

  tonservice:
    build: ./ton-service
    container_name: ton-service
    environment:
      - TON_NETWORK=mainnet
      - TREASURY_MNEMONIC=${TREASURY_MNEMONIC}
    expose:
      - 3001

  nginx:
    build: ./frontend         # 🔥 نکته بسیار مهم
    container_name: nginx-server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: