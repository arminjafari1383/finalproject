    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: #0a0a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      .telegram-error {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0a0a1a;
        color: #fff;
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }
      
      .telegram-error h1 {
        color: #e94560;
        font-size: 2.5rem;
        margin-bottom: 15px;
      }
      
      .telegram-error .icon {
        font-size: 4rem;
        margin-bottom: 20px;
      }
      
      .telegram-error p {
        color: #888;
        font-size: 1.1rem;
        max-width: 400px;
        line-height: 1.6;
      }
      
      .telegram-error .sub-text {
        color: #666;
        font-size: 0.9rem;
        margin-top: 10px;
      }
      
      .telegram-error .telegram-btn {
        margin-top: 25px;
        padding: 12px 30px;
        background: #e94560;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.3s;
      }
      
      .telegram-error .telegram-btn:hover {
        background: #c73e54;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
        display: none; /* مخفی در ابتدا */
      }
      
      #root.show {
        display: block;
      }
    </style>
  </head>
