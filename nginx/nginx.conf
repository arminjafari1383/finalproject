server {
    listen 80;
    server_name _;

    # ===========================
    # Backend: Django admin + API
    # ===========================

    # Django Admin
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ CORS headers برای دسترسی از تلگرام و مرورگر
        # نکته مهم: به جای '*' باید دامنه دقیق خود را بگذارید
        add_header 'Access-Control-Allow-Origin' 'https://aipolynet.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-Telegram-Id, X-Telegram' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        
        # ✅ Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://aipolynet.com';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, X-Telegram-Id, X-Telegram';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # Django static (برای اینکه admin css/js درست لود شود)
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===========================
    # Frontend: React SPA
    # ===========================
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        
        # ✅ هدرهای امنیتی
        add_header 'X-Frame-Options' 'DENY' always;
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'Referrer-Policy' 'no-referrer' always;
        add_header 'Content-Security-Policy' "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;";
        
        # ✅ کش کردن فایل‌های static
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===========================
    # Health check (برای Docker)
    # ===========================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ===========================
    # Error pages
    # ===========================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ===========================
    # جلوگیری از دسترسی به فایل‌های مخفی
    # ===========================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===========================
    # جلوگیری از دسترسی به فایل‌های حساس
    # ===========================
    location ~* (\.env|\.git|\.htaccess|\.htpasswd|\.ini|\.log|\.sqlite|\.db) {
        deny all;
        access_log off;
        log_not_found off;
    }
}